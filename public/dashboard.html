<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>儀表板 · 管理後台</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.25rem;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.5rem 0;
    font-size: 0.875rem;
  }
  .bar-row .label {
    flex: 0 0 100px;
    text-align: right;
    color: var(--text-soft);
    font-size: 0.825rem;
  }
  .bar-row .track {
    flex: 1;
    background: var(--bg-soft);
    height: 22px;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .bar-row .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-300), var(--primary-500));
    border-radius: 4px;
    transition: width 600ms ease-out;
  }
  .bar-row .num {
    flex: 0 0 38px;
    font-family: var(--font-serif);
    font-weight: 600;
    color: var(--primary-600);
  }
  .gap-table { width: 100%; border-collapse: collapse; }
  .gap-table th, .gap-table td {
    padding: 0.625rem 0.75rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
    font-size: 0.875rem;
  }
  .gap-table th { background: var(--bg-soft); font-weight: 600; color: var(--text-soft); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .gap-critical { color: var(--error); font-weight: 600; }
  .gap-ok { color: var(--success); font-weight: 600; }
  .last-update {
    font-size: 0.825rem;
    color: var(--muted-2);
  }
</style>
</head>
<body>

<div class="container container-wide">
<div id="flash"></div>

<div class="card">
  <div class="toolbar">
    <h2 style="margin: 0; border: none; padding: 0;">總覽</h2>
    <span class="last-update" id="lastUpdate"></span>
    <span class="spacer"></span>
    <button class="btn-secondary btn-sm" onclick="loadAll()">${ICON_REFRESH} 重新整理</button>
  </div>
  <div class="stat-grid" id="summaryRow"></div>
</div>

<div class="grid-2">
  <div class="card">
    <h2>各堂區人才分布</h2>
    <div id="byParish"><div class="loading"><span class="spinner"></span></div></div>
  </div>

  <div class="card">
    <h2>專長分類分布</h2>
    <div id="byCategory"><div class="loading"><span class="spinner"></span></div></div>
  </div>

  <div class="card">
    <h2>可服務地區分布</h2>
    <div id="byRegion"><div class="loading"><span class="spinner"></span></div></div>
  </div>

  <div class="card">
    <h2>年齡層分布</h2>
    <div id="byAge"><div class="loading"><span class="spinner"></span></div></div>
  </div>
</div>

<div class="card">
  <h2>缺口分析</h2>
  <p class="muted">尚未完成、活動日期在未來的需求單,顯示「需求人數 vs. 各所需技能可用人才的最低值」。</p>
  <div id="gapWrap"><div class="loading"><span class="spinner"></span></div></div>
</div>

</div>

<script src="/js/common.js"></script>
<script>
auth.requireAdmin();
ui.injectHeaderFooter('dashboard');

document.body.innerHTML = document.body.innerHTML.replace(/\$\{ICON_REFRESH\}/g, ui.icon('refresh'));

function bar(items) {
  if (!items || !items.length) return '<div class="empty-state"><div class="icon">'+ui.icon('chart',24)+'</div><p>無資料</p></div>';
  const max = Math.max(...items.map(i => i.count), 1);
  return items.map(i => {
    const pct = Math.round((i.count / max) * 100);
    return `<div class="bar-row">
      <div class="label" title="${i.label}">${i.label}</div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="num">${i.count}</div>
    </div>`;
  }).join('');
}

function toItems(obj) {
  if (!obj) return [];
  return Object.entries(obj)
    .map(([label, count]) => ({ label: label || '(未填)', count }))
    .sort((a, b) => b.count - a.count)
    .slice(0, 12);
}

async function loadAll() {
  try {
    const [dist, gaps] = await Promise.all([
      api.get('/api/reports/distribution'),
      api.get('/api/reports/gaps'),
    ]);

    const sum = dist.summary || {};
    const upcoming = gaps.upcomingNeeds || [];
    const summary = [
      { num: sum.total || 0,    label: '已啟用人才',  cls: '' },
      { num: sum.willing || 0,  label: '願意接受邀請', cls: 'success' },
      { num: sum.willingRate || '0%', label: '願意比例', cls: 'gold' },
      { num: upcoming.length,   label: '進行中需求', cls: '' },
      { num: upcoming.filter(g => (g.gap||0) > 0).length, label: '尚有缺口', cls: 'warn' },
    ];
    document.getElementById('summaryRow').innerHTML = summary.map(s =>
      `<div class="stat-card ${s.cls}">
        <div class="num">${s.num}</div>
        <div class="label">${s.label}</div>
      </div>`
    ).join('');

    document.getElementById('byParish').innerHTML = bar(toItems(dist.byParish));
    document.getElementById('byCategory').innerHTML = bar(toItems(dist.byCategory));
    document.getElementById('byRegion').innerHTML = bar(toItems(dist.byRegion));
    document.getElementById('byAge').innerHTML = bar(toItems(dist.byAge));

    // 缺口分析
    const shortage = gaps.skillShortage || {};
    const suggestion = gaps.suggestion || '';
    let gapHtml = '';
    if (suggestion) {
      gapHtml += `<div class="alert info">${ui.icon('info',18)}<div><strong>建議:</strong> ${escape(suggestion)}</div></div>`;
    }
    if (Object.keys(shortage).length) {
      gapHtml += '<h3 class="mt-2">短缺技能</h3>';
      const items = Object.entries(shortage).map(([name, num]) => ({ label: name, count: num }))
        .sort((a,b)=>b.count-a.count);
      gapHtml += bar(items);
    }
    if (!upcoming.length) {
      gapHtml += '<div class="empty-state mt-2"><div class="icon">'+ui.icon('calendar',24)+'</div><h3>未來無進行中的需求</h3></div>';
    } else {
      gapHtml += '<h3 class="mt-3">活動需求一覽</h3><div class="table-wrap"><table class="gap-table">';
      gapHtml += `<thead><tr>
        <th>活動</th><th>日期</th><th>所需專長(可用)</th>
        <th>急迫</th><th>需求</th><th>瓶頸</th><th>缺口</th><th style="text-align:right">動作</th>
      </tr></thead><tbody>`;
      const sorted = [...upcoming].sort((a, b) => (b.gap || 0) - (a.gap || 0));
      sorted.forEach(g => {
        const cls = g.gap > 0 ? 'gap-critical' : 'gap-ok';
        const status = g.gap > 0 ? `缺 ${g.gap} 人` : '已足夠';
        const skillTxt = (g.requiredSkills||[]).map(s => `${escape(s.name)}(${s.available})`).join('、') || '—';
        gapHtml += `<tr>
          <td><strong>${escape(g.activity || '(無名稱)')}</strong></td>
          <td>${ui.formatDate(g.date)}</td>
          <td class="muted">${skillTxt}</td>
          <td>${g.urgency ? ui.badge(g.urgency) : '—'}</td>
          <td style="text-align:right">${g.required||0}</td>
          <td style="text-align:right">${g.bottleneckAvailable||0}</td>
          <td class="${cls}" style="text-align:right">${status}</td>
          <td style="text-align:right">
            <a class="btn-ghost btn-sm" href="/roster.html?need=${g.needId}">${ui.icon('list')}</a>
            <a class="btn-ghost btn-sm" href="/matching.html?need=${g.needId}">${ui.icon('sparkle')}</a>
          </td>
        </tr>`;
      });
      gapHtml += '</tbody></table></div>';
    }
    document.getElementById('gapWrap').innerHTML = gapHtml;

    document.getElementById('lastUpdate').textContent =
      '最後更新 ' + new Date().toLocaleString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    ui.toast('載入儀表板失敗:' + e.message, 'error');
  }
}

function escape(s) { return String(s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]); }

loadAll();
</script>
</body>
</html>
