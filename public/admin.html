<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人才查詢 · 管理後台</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.875rem;
    margin-bottom: 1rem;
  }
  .result-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.875rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .result-meta .count {
    color: var(--muted);
    font-size: 0.875rem;
  }
  .result-meta .count strong {
    color: var(--primary-600);
    font-family: var(--font-serif);
    font-size: 1.125rem;
    margin: 0 0.25rem;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(45, 42, 38, 0.6);
    z-index: 9990;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    animation: slideIn 200ms;
  }
  .modal {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xl);
    max-width: 640px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h2 { margin: 0; border: none; padding: 0; }
  .modal-header h2::before { display: none; }
  .modal-body { padding: 1.5rem; }
  .modal .close-btn {
    background: none;
    color: var(--muted);
    padding: 0.25rem;
    min-height: auto;
    border-radius: 50%;
    width: 32px; height: 32px;
  }
  .modal .close-btn:hover {
    background: var(--bg-soft);
    color: var(--text);
    transform: none;
  }
  .info-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 0.75rem;
    padding: 0.625rem 0;
    border-bottom: 1px dashed var(--border);
    font-size: 0.9rem;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { color: var(--muted); }
  .info-row .val { color: var(--text); }
  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 0.875rem;
  }
  .approval-bar {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.875rem;
    margin-bottom: 1rem;
  }
  .inline-actions {
    display: inline-flex;
    gap: 0.375rem;
    flex-wrap: wrap;
    margin-left: 0.5rem;
  }
</style>
</head>
<body>

<div class="container container-wide">
<div id="flash"></div>

<div class="card">
  <h2>查詢條件</h2>
  <form id="filters">
    <div class="filter-grid">
      <div>
        <label>關鍵字 <span class="hint">姓名/Email</span></label>
        <input name="keyword" placeholder="輸入關鍵字">
      </div>
      <div>
        <label>所屬堂區</label>
        <select name="parish"><option value="">全部堂區</option></select>
      </div>
      <div>
        <label>狀態</label>
        <select name="status">
          <option value="">全部</option>
          <option>待審核</option>
          <option>已啟用</option>
          <option>暫停</option>
          <option>退出</option>
        </select>
      </div>
      <div>
        <label>願意接受邀請</label>
        <select name="willing">
          <option value="">全部</option>
          <option value="true">是</option>
          <option value="false">否</option>
        </select>
      </div>
      <div>
        <label>可服務區域 <span class="hint">逗號分隔</span></label>
        <input name="area" placeholder="台中市,彰化縣">
      </div>
      <div>
        <label>可服務時段 <span class="hint">逗號分隔</span></label>
        <input name="time" placeholder="主日,平日晚上">
      </div>
    </div>
    <div class="toolbar">
      <button type="submit">${ui.icon('search')} 查詢</button>
      <button type="button" class="btn-secondary" onclick="document.getElementById('filters').reset();search();">${ui.icon('refresh')} 重設</button>
    </div>
  </form>
</div>

<div class="card">
  <div class="result-meta">
    <h2 style="margin-bottom:0">查詢結果</h2>
    <span class="count" id="count">—</span>
  </div>
  <div id="results"></div>
</div>

<div class="card">
  <h2>前臺人才欄位設定</h2>
  <form id="fieldSettingsForm">
    <div class="settings-grid">
      <div>
        <label>所屬善會參考範例 <span class="hint">每行一項</span></label>
        <textarea name="ministryExamples" rows="6"></textarea>
      </div>
      <div>
        <label>可服務區域 <span class="hint">每行一項</span></label>
        <textarea name="serviceRegions" rows="6"></textarea>
      </div>
      <div>
        <label>可服務時段 <span class="hint">每行一項</span></label>
        <textarea name="timeSlots" rows="6"></textarea>
      </div>
    </div>
    <div class="settings-grid mt-2">
      <div>
        <label>新登錄預設狀態</label>
        <input name="defaultPersonStatus">
      </div>
      <div>
        <label>核准後狀態</label>
        <input name="approvedPersonStatus">
      </div>
      <div>
        <label>退回/暫停狀態</label>
        <input name="returnedPersonStatus">
      </div>
    </div>
    <div class="toolbar mt-2">
      <button type="submit">${ui.icon('check')} 儲存欄位設定</button>
      <button type="button" class="btn-secondary" onclick="loadFieldSettings()">${ui.icon('refresh')} 重新載入</button>
    </div>
  </form>
</div>

<div class="card">
  <div class="result-meta">
    <h2 style="margin-bottom:0">標準專長字典</h2>
    <span class="count" id="skillCount">—</span>
  </div>
  <form id="skillForm" class="filter-grid">
    <div>
      <label>專長名稱</label>
      <input name="專長名稱" required placeholder="例如:攝影、司琴">
    </div>
    <div>
      <label>分類</label>
      <input name="分類" placeholder="禮儀、行政、關懷">
    </div>
    <div>
      <label>排序</label>
      <input type="number" name="排序" value="100">
    </div>
    <div>
      <label>說明</label>
      <input name="說明" placeholder="簡短描述">
    </div>
    <div style="align-self:end">
      <button type="submit">${ui.icon('plus')} 新增專長</button>
    </div>
  </form>
  <div id="skillSettings"></div>
</div>

</div>

<div id="modalContainer"></div>

<script src="/js/common.js"></script>
<script>
auth.requireAdmin();
ui.injectHeaderFooter('admin');
let fieldSettings = {
  ministryExamples: [],
  serviceRegions: [],
  timeSlots: [],
  defaultPersonStatus: '待審核',
  approvedPersonStatus: '已啟用',
  returnedPersonStatus: '暫停',
};

(async function() {
  // Replace literal ${ui.icon} pattern
  document.querySelectorAll('button').forEach(b => {
    if (b.innerHTML.includes('${ui.icon')) {
      b.innerHTML = b.innerHTML.replace(/\$\{ui\.icon\('([^']+)'\)\}/g, (_, name) => ui.icon(name));
    }
  });

  try {
    const { records } = await api.get('/api/parishes');
    const sel = document.querySelector('select[name=parish]');
    sel.innerHTML += records.map(p => `<option value="${p.id}">${p['堂區名稱']}</option>`).join('');
  } catch (e) {
    ui.toast('載入堂區清單失敗', 'error');
  }
  await loadFieldSettings();
  await loadSkillSettings();
  search();
})();

document.getElementById('filters').addEventListener('submit', (e) => {
  e.preventDefault();
  search();
});

document.getElementById('fieldSettingsForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  await saveFieldSettings();
});

document.getElementById('skillForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  await createSkill();
});

async function search() {
  const fd = new FormData(document.getElementById('filters'));
  const params = new URLSearchParams();
  ['keyword','parish','status','willing','area','time'].forEach(k => {
    const v = fd.get(k); if (v) params.set(k, v);
  });

  ui.loading('results', '正在查詢…');

  try {
    const { count, records } = await api.get('/api/people?' + params.toString());
    document.getElementById('count').innerHTML = `共 <strong>${count}</strong> 筆`;
    if (count === 0) {
      ui.empty('results', '沒有符合條件的資料,請調整篩選條件', 'search');
      return;
    }
    document.getElementById('results').innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>姓名</th>
            <th>性別</th>
            <th>居住地</th>
            <th>狀態</th>
            <th>願邀請</th>
            <th>更新日期</th>
            <th style="text-align:right">動作</th>
          </tr></thead>
          <tbody>
            ${records.map(p => `
              <tr>
                <td><strong>${escape(p['姓名'])}</strong>${p['英文名']?` <span class="muted-2">(${escape(p['英文名'])})</span>`:''}</td>
                <td>${escape(p['性別'] || '—')}</td>
                <td>${escape(p['居住地區'] || '—')}</td>
                <td>${ui.badge(p['狀態'] || '待審核')}</td>
                <td>${p['是否願意接受邀請']
                  ? '<span class="badge badge-success">'+ui.icon('check',12)+' 願意</span>'
                  : '<span class="badge badge-muted">否</span>'}</td>
                <td class="muted-2">${ui.formatDate(p['更新日期'])}</td>
                <td style="text-align:right">
                  <button class="btn-ghost btn-sm" onclick="viewDetail('${p.id}')">${ui.icon('eye')} 詳情</button>
                  ${(p['狀態'] || '待審核') === '待審核'
                    ? `<button class="btn-sm" onclick="setPersonStatus('${p.id}', fieldSettings.approvedPersonStatus || '已啟用')">${ui.icon('check')} 核准</button>`
                    : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (err) {
    ui.toast(err.message, 'error');
    ui.empty('results', '查詢失敗:' + err.message, 'warn');
  }
}

async function viewDetail(id) {
  const c = document.getElementById('modalContainer');
  c.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="modal-body loading"><span class="spinner"></span> 載入中…</div></div>
  </div>`;
  try {
    const { person, skills, experience } = await api.get('/api/people/' + id);
    const p = person.fields || person;
    c.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <div class="modal-header">
            <h2>${escape(p['姓名'])} ${p['英文名']?'<span class="muted-2" style="font-weight:normal;font-size:0.9em">('+escape(p['英文名'])+')</span>':''}</h2>
            <button class="close-btn" onclick="closeModal()">${ui.icon('x', 18)}</button>
          </div>
          <div class="modal-body">
            <div class="approval-bar">
              <div class="toolbar">
                <button onclick="setPersonStatus('${id}', fieldSettings.approvedPersonStatus || '已啟用')">${ui.icon('check')} 核准啟用</button>
                <button class="btn-secondary" onclick="setPersonStatus('${id}', fieldSettings.returnedPersonStatus || '暫停')">${ui.icon('warn')} 暫停/退回</button>
                <button class="btn-ghost" onclick="createSelfUpdateLink('${id}')">${ui.icon('mail')} 產生更新連結</button>
              </div>
            </div>
            <h3>基本資料</h3>
            <div>
              <div class="info-row"><span class="label">性別</span><span class="val">${escape(p['性別']||'—')}</span></div>
              <div class="info-row"><span class="label">出生年</span><span class="val">${p['出生年份']||'—'}</span></div>
              <div class="info-row"><span class="label">手機</span><span class="val">${escape(p['手機']||'—')}</span></div>
              <div class="info-row"><span class="label">Email</span><span class="val">${escape(p['Email']||'—')}</span></div>
              <div class="info-row"><span class="label">居住地區</span><span class="val">${escape(p['居住地區']||'—')}</span></div>
              <div class="info-row"><span class="label">狀態</span><span class="val">${ui.badge(p['狀態']||'待審核')}</span></div>
              <div class="info-row"><span class="label">願意邀請</span><span class="val">${p['是否願意接受邀請']?ui.badge('願意'):ui.badge('否')}</span></div>
              <div class="info-row"><span class="label">可服務時段</span><span class="val">${(p['可服務時段']||[]).map(t=>`<span class="chip">${t}</span>`).join('')||'—'}</span></div>
              <div class="info-row"><span class="label">所屬善會</span><span class="val">${escape(p['所屬善會文字']||'') || (p['所屬善會']||[]).map(t=>`<span class="chip">${t}</span>`).join('') || '—'}</span></div>
              <div class="info-row"><span class="label">備註</span><span class="val">${escape(p['備註']||'—')}</span></div>
            </div>

            <h3 class="mt-3">專長(${skills.length})</h3>
            ${skills.length ? `<ul>${skills.map(s => `
              <li style="padding:0.5rem 0;border-bottom:1px dashed var(--border);font-size:0.9rem;">
                <strong>${(s.fields&&s.fields['專長名稱'])||s['專長名稱']||(s['專長']||[])[0]||'—'}</strong>
                ${(s.fields&&s.fields['熟練程度'])||s['熟練程度']?` · ${(s.fields&&s.fields['熟練程度'])||s['熟練程度']}`:''}
                ${ui.badge((s.fields&&s.fields['審核狀態'])||s['審核狀態']||'待審')}
                ${((s.fields&&s.fields['審核狀態'])||s['審核狀態']||'待審') === '待審'
                  ? `<span class="inline-actions">
                      <button class="btn-sm" onclick="approveSkill('${s.id}', '通過', '${id}')">${ui.icon('check')} 通過</button>
                      <button class="btn-secondary btn-sm" onclick="approveSkill('${s.id}', '退回', '${id}')">${ui.icon('x')} 退回</button>
                    </span>`
                  : ''}
              </li>`).join('')}</ul>` : '<p class="muted">尚無資料</p>'}

            <h3 class="mt-3">服務經驗(${experience.length})</h3>
            ${experience.length ? `<ul>${experience.map(e => `
              <li style="padding:0.5rem 0;border-bottom:1px dashed var(--border);font-size:0.9rem;">
                <strong>${(e.fields&&e.fields['活動名稱'])||e['活動名稱']||(e.fields&&e.fields['ActivityName'])||e['ActivityName']||'—'}</strong>
                ${((e.fields&&e.fields['開始日期'])||e['開始日期']||(e.fields&&e.fields['活動日期'])||e['活動日期']) ? `<span class="muted-2"> · ${ui.formatDate((e.fields&&e.fields['開始日期'])||e['開始日期']||(e.fields&&e.fields['活動日期'])||e['活動日期'])}</span>` : ''}
                ${(e.fields&&e.fields['角色'])||e['角色']||(e.fields&&e.fields['Role'])||e['Role']?` · ${(e.fields&&e.fields['角色'])||e['角色']||(e.fields&&e.fields['Role'])||e['Role']}`:''}
              </li>`).join('')}</ul>` : '<p class="muted">尚無資料</p>'}
          </div>
        </div>
      </div>`;
  } catch (err) {
    ui.toast(err.message, 'error');
    closeModal();
  }
}

async function loadFieldSettings() {
  try {
    const { settings } = await api.get('/api/settings/talent-fields');
    fieldSettings = settings || fieldSettings;
    const form = document.getElementById('fieldSettingsForm');
    form.ministryExamples.value = (fieldSettings.ministryExamples || []).join('\n');
    form.serviceRegions.value = (fieldSettings.serviceRegions || []).join('\n');
    form.timeSlots.value = (fieldSettings.timeSlots || []).join('\n');
    form.defaultPersonStatus.value = fieldSettings.defaultPersonStatus || '待審核';
    form.approvedPersonStatus.value = fieldSettings.approvedPersonStatus || '已啟用';
    form.returnedPersonStatus.value = fieldSettings.returnedPersonStatus || '暫停';
  } catch (err) {
    ui.toast('載入欄位設定失敗:' + err.message, 'error');
  }
}

async function saveFieldSettings() {
  const form = document.getElementById('fieldSettingsForm');
  const payload = {
    ministryExamples: lines(form.ministryExamples.value),
    serviceRegions: lines(form.serviceRegions.value),
    timeSlots: lines(form.timeSlots.value),
    defaultPersonStatus: form.defaultPersonStatus.value,
    approvedPersonStatus: form.approvedPersonStatus.value,
    returnedPersonStatus: form.returnedPersonStatus.value,
  };
  try {
    const { settings } = await api.put('/api/settings/talent-fields', payload);
    fieldSettings = settings;
    ui.toast('前臺欄位設定已儲存', 'success');
  } catch (err) {
    ui.toast('儲存欄位設定失敗:' + err.message, 'error');
  }
}

async function loadSkillSettings() {
  ui.loading('skillSettings', '載入專長字典…');
  try {
    const { records } = await api.get('/api/skills-admin');
    document.getElementById('skillCount').innerHTML = `共 <strong>${records.length}</strong> 項`;
    if (!records.length) {
      ui.empty('skillSettings', '尚無標準專長', 'list');
      return;
    }
    document.getElementById('skillSettings').innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>專長</th><th>分類</th><th>排序</th><th>狀態</th><th style="text-align:right">動作</th></tr></thead>
          <tbody>
            ${records.map(s => `
              <tr>
                <td><strong>${escape(s['專長名稱'] || '—')}</strong><div class="muted-2">${escape(s['說明'] || '')}</div></td>
                <td>${escape(s['分類'] || '—')}</td>
                <td>${s['排序'] || 0}</td>
                <td>${s['是否啟用'] === false ? ui.badge('停用') : ui.badge('已啟用')}</td>
                <td style="text-align:right">
                  <button class="btn-secondary btn-sm" onclick="toggleSkill('${s.id}', ${s['是否啟用'] === false})">
                    ${s['是否啟用'] === false ? '啟用' : '停用'}
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (err) {
    ui.toast('載入專長字典失敗:' + err.message, 'error');
    ui.empty('skillSettings', '載入專長字典失敗', 'warn');
  }
}

async function createSkill() {
  const form = document.getElementById('skillForm');
  const fd = new FormData(form);
  const payload = {
    '專長名稱': fd.get('專長名稱'),
    '分類': fd.get('分類') || '',
    '說明': fd.get('說明') || '',
    '排序': Number(fd.get('排序') || 100),
    '是否啟用': true,
  };
  try {
    await api.post('/api/skills', payload);
    form.reset();
    form['排序'].value = 100;
    ui.toast('專長已新增', 'success');
    await loadSkillSettings();
  } catch (err) {
    ui.toast('新增專長失敗:' + err.message, 'error');
  }
}

async function toggleSkill(id, enable) {
  try {
    await api.put('/api/skills/' + id, { '是否啟用': enable });
    ui.toast(enable ? '專長已啟用' : '專長已停用', 'success');
    await loadSkillSettings();
  } catch (err) {
    ui.toast('更新專長失敗:' + err.message, 'error');
  }
}

async function setPersonStatus(id, status) {
  try {
    await api.put('/api/people/' + id + '/status', { status });
    ui.toast('人才狀態已更新為:' + status, 'success');
    closeModal();
    await search();
  } catch (err) {
    ui.toast('更新人才狀態失敗:' + err.message, 'error');
  }
}

async function approveSkill(id, decision, personId) {
  try {
    await api.put('/api/people-skills/' + id + '/approve', { decision });
    ui.toast('專長審核已更新為:' + decision, 'success');
    await viewDetail(personId);
  } catch (err) {
    ui.toast('專長審核失敗:' + err.message, 'error');
  }
}

async function createSelfUpdateLink(id) {
  try {
    const { url } = await api.get('/api/people/' + id + '/self-update-link');
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(url);
      ui.toast('更新連結已複製', 'success');
    } else {
      prompt('請複製更新連結', url);
    }
  } catch (err) {
    ui.toast('產生更新連結失敗:' + err.message, 'error');
  }
}

function lines(value) {
  return String(value || '').split(/\r?\n|,|，|、/).map(s => s.trim()).filter(Boolean);
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
}

function escape(s) {
  return String(s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]);
}
</script>
</body>
</html>
