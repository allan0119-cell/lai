            state.quiz.selectedOption = null;

            state.quiz.selectedOption = optionIndex;
            state.quiz.showFeedback = true;
            render(); 

            setTimeout(() => {
                const q = state.quiz.questions[state.quiz.currentQ];
                if (optionIndex === q.ans) {
                    state.quiz.score += 10;
                }

                if (state.quiz.currentQ < 9) {
                    state.quiz.currentQ += 1;
                    state.quiz.showFeedback = false;
                    state.quiz.selectedOption = null;
                } else {
                    state.quiz.step = 'result';
                }
                render();
            }, 1200);
        }

        // (C) 退休資產配置 
        function renderRetirement() {
            const { step, inputs, risk } = state.retirement;
            const calculate = () => {
                const workYears = inputs.retireAge - inputs.currentAge;
                const retireYears = inputs.lifeAge - inputs.retireAge;
                const inflationRate = 0.02; 
                const inflationFactor = Math.pow(1 + inflationRate, workYears);
                const pension = Math.round(inputs.insuredSalary * (inputs.laborYears + workYears) * 0.0155);
                const monthlyFood = inputs.dailyFoodCost * 30;
                
                const calcLevel = (base) => {
                    const futureMonthly = Math.round(base * inflationFactor);
                    const monthlyGap = Math.max(0, futureMonthly - pension);
                    const totalGap = Math.max(0, (monthlyGap * 12 * retireYears) - inputs.currentSavings);
                    return { totalGap };
                };
                const basic = calcLevel(monthlyFood);
                const standard = calcLevel(monthlyFood + 20000);
                const premium = calcLevel(monthlyFood + 50000);
                const monthlyFoodGap = Math.max(0, Math.round(monthlyFood * inflationFactor) - pension);
                const foodGap = Math.max(0, (monthlyFoodGap * 12 * retireYears) - inputs.currentSavings);
                return { pension, basic, standard, premium, inflationFactor, foodGap };
            };
            const result = step === 'result' ? calculate() : null;
            const format = (n) => new Intl.NumberFormat('zh-TW').format(n);

        function calcRainbow() {
            const val = document.getElementById('bdate').value;
            if(!val) return;
            const d = new Date(val);
            const reduce = (n) => {
                while(n > 9 && n!==11 && n!==22 && n!==33) n = n.toString().split('').reduce((a,b)=>parseInt(a)+parseInt(b),0);
                if(n>9) n = n.toString().split('').reduce((a,b)=>parseInt(a)+parseInt(b),0);
                return n;
            };
            const mainNum = reduce(d.getFullYear() + d.getMonth()+1 + d.getDate());
            
            // 計算流年流日 (以當前年份計算)
            const today = new Date();
            const currentYear = today.getFullYear();
            const pYear = reduce(currentYear + (d.getMonth()+1) + d.getDate());
            const pMonth = reduce(pYear + (today.getMonth()+1));
            const pDay = reduce(pMonth + today.getDate());
            
            state.rainbow.result = { mainNum, personalYear: pYear, personalDay: pDay };
            render();
        }
